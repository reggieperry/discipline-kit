name: ci

# A discipline kit whose own repo has no gate is an argument against itself. This runs the kit's
# acceptance suite on every push and PR. Read-only permissions and no secrets, so fork PRs are safe
# by default (the jobs never need any). No external toolchains — bash, python3, and git only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scrub-gate (no private identifiers anywhere)
        run: bash scrub-gate.sh

      - name: ledger board selftest (views match the committed fixture)
        run: bash harness/ledger/board.sh --selftest

      - name: retire immutability fixture (verbatim-move green, old rewrite red)
        run: python3 harness/ledger/fixtures/retire_immutable_test.py

      - name: red-proof fixture (genuine test passes, tautology rejected)
        run: python3 harness/ledger/fixtures/red_proof_test.py

      - name: tdd-precedence + coverage fixture (claim precedes code; red-proof coverage counts)
        run: python3 harness/ledger/fixtures/tdd_precedence_test.py

      - name: installer --upgrade fixture (kit-owned overwritten, repo-owned untouched, VERSION stamped)
        run: python3 harness/ledger/fixtures/install_upgrade_test.py

      - name: gate sentinel fixture (env overrides ignored without ledger/.test-mode)
        run: python3 harness/ledger/fixtures/gate_sentinel_test.py

      - name: java plumbing fixture (mvn/gradle check_command; .java auto-detect; vendored-java inert)
        run: python3 harness/ledger/fixtures/java_plumbing_test.py

      - name: squash-safe precedence fixture (--certify emits; main-side consumes the certificate)
        run: python3 harness/ledger/fixtures/squash_precedence_test.py

      - name: memory-index size fixture (soft WARNs, hard FAILs — index honesty with teeth)
        run: python3 harness/ledger/fixtures/memory_index_test.py

      - name: install-completeness fixture (referenced docs vendored into the target on install)
        run: python3 harness/ledger/fixtures/install_completeness_test.py

      - name: refresh-rules fixture (install.sh --refresh-rules re-syncs rules into an existing install)
        run: python3 harness/ledger/fixtures/refresh_rules_test.py

      - name: inbound-guard fixture (an added signed ledger line is rejected on the inbound path)
        run: python3 harness/ledger/fixtures/inbound_guard_test.py

      - name: interchange fixture (valid/receipt-failing/forged-passing/malformed blocks graded)
        run: python3 harness/ledger/fixtures/interchange_test.py

      - name: authoring-artifacts fixture (the ADR/story templates + four skills keep their structure)
        run: python3 harness/ledger/fixtures/authoring_artifacts_test.py

      - name: chain-install fixture (--with-chain installs the 5 agents + /chain; base installs neither)
        run: python3 harness/ledger/fixtures/chain_install_test.py

      - name: gate in-commit signing fixture (claim signs IN its commit; clean tree, no post-commit dirt)
        run: python3 harness/ledger/fixtures/gate_signing_test.py

      - name: gate forgery-sweep fixture (an unstaged forged signed line is not laundered by git add)
        run: python3 harness/ledger/fixtures/gate_forgery_sweep_test.py

      - name: gate copies byte-identity (gate.py/audit.py/model.py master==active)
        run: python3 harness/ledger/fixtures/gate_copies_identical_test.py

      - name: ledger-model laws (calculus invariants over generated ledgers — the Python analog of the Scala laws)
        run: python3 harness/ledger/fixtures/model_laws_test.py

      - name: install mypy (the static type gate — the kit dogfoods it even though it ships skip-if-absent)
        run: pip install mypy

      - name: mypy type gate (the typed calculus + chain predicates)
        run: python3 -m mypy --ignore-missing-imports harness/ledger/model.py harness/ledger/gate.py harness/chain/postcondition.py harness/chain/verdict.py

      - name: chain trusted-base fence fixture (a phase touching the gate/hooks/CI/.claude trips exit 2)
        run: python3 harness/ledger/fixtures/chain_fence_test.py

      - name: chain acceptance fixture (the 3 fail-closed refusals halt; clean states advance)
        run: python3 harness/ledger/fixtures/chain_acceptance_test.py

      - name: chain verdict fixture (four-state committee; errored/absent role never reads CLEAN)
        run: python3 harness/ledger/fixtures/chain_verdict_test.py

      - name: precedence PR mode (emit certificates on the intact branch, pre-squash; read-only)
        if: github.event_name == 'pull_request'
        run: python3 harness/ledger/audit.py --certify

      - name: differential gate unit tests (36 stdlib tests, incl. the Java toolchain)
        run: python3 reference/test_sdlc_gate.py

      - name: algebra check (re-prove the ledger-dynamics laws + laundering exhibits)
        # validate_note.py fails closed (exits non-zero) if any base law or laundering
        # exhibit regresses — a reintroduced ⊗ₖ glut-identity or ∨ₜ dual laundering fails CI by name.
        run: python3 harness/algebra/validate_note.py
