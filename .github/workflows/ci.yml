name: ci

# A discipline kit whose own repo has no gate is an argument against itself. This runs the kit's
# acceptance suite on every push and PR. Read-only permissions and no secrets, so fork PRs are safe
# by default (the jobs never need any).
#
# CI runs `scripts/check.sh` — the same script the commit path runs — rather than mirroring its
# invocations step by step. The mirror was the defect: it drifted to 5 of 30 invocations while
# every push read green, and no court reads this file to catch it. Delegation kills the class; a
# check added to check.sh is in CI the same commit, with no list to keep identical. Toolchain:
# bash, python3 (3.11+ for tomllib), git, and shellcheck — the one tool the suite needs that the
# runner does not carry, installed below from the distribution archive.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: the commit-path suite, whole
        run: bash scripts/check.sh
